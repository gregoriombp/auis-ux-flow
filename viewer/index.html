<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="auis-ux-flow viewer __VIEWER_VERSION__" />
    <meta name="color-scheme" content="light dark" />
    <title>UX flows</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='8' r='3' fill='%232563eb'/%3E%3Ccircle cx='11' cy='8' r='3' fill='%23059669'/%3E%3C/svg%3E" />
    <script>
      // Theme before first paint. Stored choice wins over the system setting.
      try {
        var t = localStorage.getItem("auis-ux-flow:theme")
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = "light"
      }
    </script>
    <!-- The manifest sits next to this file and lists the flows to show. -->
    <script src="flows.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
